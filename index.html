<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            align-self: flex-start;
        }

        form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #333;
            color: white;
        }

        button {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #9c7cf6;
        }

        #todo-list {
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }

        #todo-list li {
            background-color: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-text {
            cursor: pointer;}

        .task-completed {
            text-decoration: line-through;
            color: #888;}

        .delete-button {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #ff6666;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Заголовок -->
    <h1>Мои задачи</h1>

    <!-- Форма добавления задачи -->
    <form>
        <input type="text" placeholder="Новая задача">
        <button type="submit">Добавить</button>
    </form>

    <!-- Список задач -->
    <ul id="todo-list">
    </ul>

    <!-- Счётчик задач -->
    <p>Всего: 0</p>

    <!-- Подключение скрипта -->
    <script src="script.js"></script>
</body>
</html>
